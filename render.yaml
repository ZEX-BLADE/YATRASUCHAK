# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub/GitLab, then in Render choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and provisions both services automatically.
#
# The web service runs from the PROJECT ROOT (this file's directory) with
# `uvicorn backend.main:app`, matching how backend/main.py's imports and
# the test suite both expect to be run.

databases:
  - name: yatrasuchak-db
    plan: free
    databaseName: yatrasuchak
    user: yatrasuchak

services:
  - type: web
    name: yatrasuchak-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yatrasuchak-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FRONTEND_ORIGIN
        sync: false  # set this to your deployed frontend's URL after it's up
